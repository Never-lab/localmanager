name: CI

on:
  push:
  pull_request:

jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Test sim, API, and web
        run: npm test
      - run: npm run build

  maps:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/maps
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: services/maps/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m py_compile render.py worker.py test_worker.py
      - run: python render.py --self-test
